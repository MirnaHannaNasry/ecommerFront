    (function(){ var m = window.matchMedia('(prefers-color-scheme: dark)');
      function set(){ document.documentElement.setAttribute('data-bs-theme', m.matches ? 'dark' : 'light'); }
      set(); m.addEventListener && m.addEventListener('change', set); })();
  </script>
