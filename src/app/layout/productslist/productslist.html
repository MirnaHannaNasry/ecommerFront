<div class="container">
<h1>Our Products</h1>

<div class="d-flex flex-wrap gap-2 mb-3">
    <button class="chip" [class.on]="!category" (click)="onCategory('')">All</button>
    @for(c of categories;track c._id){
    <button class="chip" [class.on]="category === c.slug" (click)="onCategory(c.slug)">{{c.name}}</button>
    }
</div>

<div class="row g-2 mb-4 align-items-center">
    <div class="col-12 col-md-4">
        <input type="search" class="form-control" placeholder="Search products..." [value]="search" (input)="onSearch($any($event.target).value)">
    </div>
    <div class="col-6 col-md-4">
        <select class="form-select" [value]="sort" (change)="onSort($any($event.target).value)">
            <option value="createdAt:desc">Newest</option>
            <option value="price:asc">Price: low to high</option>
            <option value="price:desc">Price: high to low</option>
            <option value="name:asc">Name A-Z</option>
        </select>
    </div>
    <div class="col-6 col-md-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="inStock" [checked]="inStock" (change)="onInStock($any($event.target).checked)">
            <label class="form-check-label" for="inStock">In stock only</label>
        </div>
    </div>
</div>

@if(errorMessage){
    <div class="alert alert-danger">{{errorMessage}} <button class="btn btn-sm btn-outline-danger ms-2" (click)="loadProducts()">Retry</button></div>
}
@else if(loading){
    <div class="text-center py-5"><div class="spinner-border" role="status"></div></div>
}
@else if(products.length === 0){
    <div class="text-center text-muted py-5">No products found. Try another search or category.</div>
}
@else{
<div class="row">
@for(product of products;track product._id){
    <div class="col-12 col-sm-6 col-lg-3 mb-4">
        <app-product [myProduct] = "product"></app-product>
    </div>
}
</div>
<app-pagination [page]="page" [totalPages]="totalPages" (pageChange)="onPage($event)"></app-pagination>
}
</div>
