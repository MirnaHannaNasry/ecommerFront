<div class="card h-100 product-card">
    <a [routerLink]="'/product-list/' + myProduct.slug" class="imgbox">
        <img [src]="staticURL + myProduct.imgURL" class="card-img-top" [alt]="myProduct.name">
        @if(myProduct.stock <= 0){ <span class="tag bg-danger">Out of stock</span> }
        @else if(myProduct.stock <= 3){ <span class="tag bg-warning text-dark">Only {{myProduct.stock}} left</span> }
    </a>
    <div class="card-body d-flex flex-column">
        <a [routerLink]="'/product-list/' + myProduct.slug" class="card-title h6 text-decoration-none name">{{myProduct.name}}</a>
                <div class="mt-auto d-flex justify-content-between align-items-center">
            <strong class="price">{{myProduct.price | currency:'EGP':'code':'1.0-2'}}</strong>
            <button class="btn btn-primary btn-sm" [disabled]="myProduct.stock <= 0" (click)="addToCart()">Add to cart</button>
        </div>
    </div>
</div>
