<div class="toast-container position-fixed bottom-0 end-0 p-3">
    @for(t of toasts$ | async; track t.id){
    <div class="toast show align-items-center border-0 text-white mb-2"
         [class.bg-success]="t.type === 'success'"
         [class.bg-danger]="t.type === 'error'"
         [class.bg-primary]="t.type === 'info'" role="alert">
        <div class="d-flex">
            <div class="toast-body">{{t.text}}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="_toastService.close(t.id)"></button>
        </div>
    </div>
    }
</div>
