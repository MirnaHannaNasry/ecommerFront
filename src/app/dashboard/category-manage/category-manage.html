<div class="container">
<h1>Categories</h1>

<form class="row g-2 align-items-end mb-4" [formGroup]="form" (ngSubmit)="save()">
    <div class="col-md-6">
        <label class="form-label">{{editing ? 'Rename category' : 'New category'}}</label>
        <input class="form-control" formControlName="name" placeholder="e.g. Shoes">
    </div>
    <div class="col-auto">
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="catActive" formControlName="isActive">
            <label class="form-check-label" for="catActive">Active</label>
        </div>
    </div>
    <div class="col-auto">
        <button class="btn btn-primary" [disabled]="saving">{{editing ? 'Save' : 'Add'}}</button>
        @if(editing){ <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancel()">Cancel</button> }
    </div>
</form>

@if(loading){
    <div class="text-center py-5"><div class="spinner-border" role="status"></div></div>
}
@else if(errorMessage){
    <div class="alert alert-danger">{{errorMessage}}</div>
}
@else{
<table class="table align-middle">
    <thead><tr><th>Name</th><th>Slug</th><th>Status</th><th></th></tr></thead>
    <tbody>
        @for(c of categories;track c._id){
        <tr>
            <td class="fw-semibold">{{c.name}}</td>
            <td class="text-muted">{{c.slug}}</td>
            <td><span class="badge" [class.bg-success]="c.isActive" [class.bg-warning]="!c.isActive" [class.text-dark]="!c.isActive">{{c.isActive ? 'Active' : 'Hidden'}}</span></td>
            <td class="text-end">
                <button class="btn btn-outline-secondary btn-sm me-1" (click)="edit(c)">Edit</button>
                <button class="btn btn-outline-danger btn-sm" (click)="remove(c)">Delete</button>
            </td>
        </tr>
        } @empty {
        <tr><td colspan="4" class="text-center text-muted">No categories yet. Add one to start adding products.</td></tr>
        }
    </tbody>
</table>
}
</div>
