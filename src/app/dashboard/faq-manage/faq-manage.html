<div class="container">
<span class="eyebrow">Content</span>
<h1>FAQ</h1>
<p class="text-muted">These questions appear on the public FAQ page.</p>

<form class="card card-body mb-4" [formGroup]="form" (ngSubmit)="save()">
    <label class="form-label">{{editing ? 'Edit question' : 'New question'}}</label>
    <input class="form-control mb-2" formControlName="question" placeholder="e.g. How long does delivery take?">
    <textarea class="form-control mb-3" rows="3" formControlName="answer" placeholder="The answer customers will read"></textarea>
    <div>
        <button class="btn btn-primary" [disabled]="saving">{{editing ? 'Save changes' : 'Add question'}}</button>
        @if(editing){ <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancel()">Cancel</button> }
    </div>
</form>

@if(loading){
    <div class="text-center py-5"><div class="spinner-border" role="status"></div></div>
}
@else if(errorMessage){
    <div class="alert alert-danger">{{errorMessage}}</div>
}
@else{
<table class="table align-middle">
    <thead><tr><th>Question</th><th>Answer</th><th></th></tr></thead>
    <tbody>
        @for(f of faqs;track f._id){
        <tr>
            <td class="fw-semibold q">{{f.question}}</td>
            <td class="text-muted a">{{f.answer}}</td>
            <td class="text-end text-nowrap">
                <button class="btn btn-outline-secondary btn-sm me-1" (click)="edit(f)">Edit</button>
                <button class="btn btn-outline-danger btn-sm" (click)="remove(f)">Delete</button>
            </td>
        </tr>
        } @empty {
        <tr><td colspan="3" class="text-center text-muted">No questions yet.</td></tr>
        }
    </tbody>
</table>
}
</div>
